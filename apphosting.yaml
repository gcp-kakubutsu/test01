# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 1      # 1インスタンス常時起動でコスト削減
  maxInstances: 100    # 適切な最大インスタンス数
  concurrency: 80      # 標準的な同時リクエスト数
  cpu: 4               # 4コアで十分な性能
  memoryMiB: 8192      # 8GBメモリで安定動作

