# apphosting.staging.yaml
# 生成日: Mon Oct 20 09:47:42 JST 2025
# プロジェクト: nukune-staging-1760909410
# リージョン: asia-east1

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 100
  cpu: 1
  memoryMiB: 4096

  # 固定IP用のVPC設定
  vpcAccess:
    egress: ALL_TRAFFIC
    networkInterfaces:
      - network: projects/nukune-staging-1760909410/global/networks/default
        subnetwork: projects/nukune-staging-1760909410/regions/asia-east1/subnetworks/default

env:
  # Firebase Client SDK（公開）
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDWNVOB0BC4hCxuYqql3Rch1AftQ3yHIgE
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: nukune-staging-1760909410.firebaseapp.com
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: nukune-staging-1760909410
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: nukune-staging-1760909410.firebasestorage.app
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "683694012363"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:683694012363:web:b3035ab2e27dca7ea2284e
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-RZB50LSRQS
    availability: [BUILD, RUNTIME]

  # Firebase Admin SDK（シークレット）
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: nukune-staging-1760909410
    availability: [BUILD, RUNTIME]

  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    secret: firebase-admin-client-email
    availability: [BUILD, RUNTIME]

  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: firebase-admin-private-key
    availability: [BUILD, RUNTIME]

  # MySQL設定
  - variable: DB_HOST
    value: /cloudsql/nukune-staging-1760909410:asia-east1:nukune-mysql
    availability: [RUNTIME]

  - variable: DB_USER
    value: nukune_app
    availability: [RUNTIME]

  - variable: DB_PASSWORD
    secret: db-password
    availability: [RUNTIME]

  - variable: DB_NAME
    value: nukune_db
    availability: [RUNTIME]

  - variable: DB_PORT
    value: "3306"
    availability: [RUNTIME]

  # APIキー
  - variable: TRANSACTION_HUB_API_KEY
    secret: transaction-hub-api-key
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_TRANSACTION_HUB_API_KEY
    secret: transaction-hub-api-key
    availability: [BUILD, RUNTIME]

  - variable: GOOGLE_GENKIT_API_KEY
    secret: google-genkit-api-key
    availability: [BUILD, RUNTIME]

  # セキュリティ
  - variable: API_REGISTER_PASSWORD
    secret: api-register-password
    availability: [RUNTIME]

  - variable: JWT_SECRET
    secret: jwt-secret
    availability: [RUNTIME]

  # その他
  - variable: NODE_ENV
    value: production
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_RESERVATION_SITE_URL
    value: https://stg.nukipedia.jp
    availability: [BUILD, RUNTIME]

# Cloud SQL接続
cloudSqlInstances:
  - connectionName: nukune-staging-1760909410:asia-east1:nukune-mysql
